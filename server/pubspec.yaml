name: server
description: AiCMHCS（智慧儿童孤独症管理系统）后端 API 服务，基于 Dart Frog + 达梦 DM8（DPI/FFI）
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  common: ^0.1.0
  # 字段级存储加密（FieldCipher：AES-256-GCM / HMAC-SHA256 / HKDF）
  cryptography: ^2.7.0
  crypto: ^3.0.0
  dart_frog: ^1.1.0
  ffi: ^2.1.0
  # 生产依赖：初筛【获取DeepSeek AI建议】调用外部 API（见
  # lib/services/ai_guidance_service.dart）；此前仅作为 tool/ 脚本的
  # dev 依赖，2026-11-25 提升为正式依赖
  http: ^1.0.0
  # PostgreSQL 网关（非信创医院可选发行档；纯 Dart 实现，无原生依赖）
  postgres: ^3.6.0
  # 业务主键生成（UUID v7：时间有序，可按字符串排序近似创建序）
  uuid: ^4.5.1
  # 精确固定 2.4.0（勿加 ^）：3.x 删除了 open.dart 的动态库覆盖机制，
  # 改为构建期 hook 下载预编译库，与 dart_frog 打包、离线信创环境、
  # 随包分发 sqlite3.dll 均冲突。
  sqlite3: 2.4.0

dev_dependencies:
  dart_frog_lint: ^0.1.0
  test: ^1.0.0
